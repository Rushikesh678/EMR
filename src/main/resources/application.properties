```properties
# Healthcare Appointment & EMR System
spring.application.name=healthcare-emr-system
server.port=${PORT:8080}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Console
spring.h2.console.enabled=false

# JWT Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${UPLOAD_DIR:./uploads/reports/}

# Email Development Mode
app.mail.dev-mode=${MAIL_DEV_MODE:true}
app.mail.sender=${MAIL_SENDER:noreply@healthcare.local}
```

# Healthcare Appointment & Electronic Medical Record (EMR) System Configuration
spring.application.name=healthcare-emr-system
server.port=8080

# Primary DataSource: H2 in-memory by default for immediate out-of-the-box execution,
# or seamlessly overridden by environment variables / MySQL profile
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:healthcare_emr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console for development inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
app.jwt.secret=HealthcareEMRSecureKeyMustBeAtLeast256BitsLongForHMACSHA256Signature2026Secure
app.jwt.expiration-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=./uploads/reports/

# Email Notification Development Preview Mode
app.mail.dev-mode=true
app.mail.sender=noreply@healthcare.local

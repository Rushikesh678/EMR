# MySQL Profile Configuration
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or setting environment variable: SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/healthcare_emr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:your_mysql_password_here}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console disabled in production/MySQL mode
spring.h2.console.enabled=false
